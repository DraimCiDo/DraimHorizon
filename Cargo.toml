[package]
name = "claim-borders"
version = "0.40.3"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Client-side claim boundaries from Horizon SMP /claims responses"
repository = "https://github.com/DraimCiDo/DraimHorizon"

[lib]
path = "src/lib.rs"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[dependencies]
serde_json = "1"

claim-borders-relay-client = { path = "mixins/draimhorizon/relay_client" }

[workspace]
members = ["mixins/draimhorizon/relay_client"]
resolver = "2"
